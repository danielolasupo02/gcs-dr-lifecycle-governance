route:
  receiver: lab-webhook
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  # Lab receiver: logs every notification so scripts can prove delivery.
  # In production this would be a Slack, email or PagerDuty receiver.
  - name: lab-webhook
    webhook_configs:
      - url: http://receiver:5001/alerts
        send_resolved: true
